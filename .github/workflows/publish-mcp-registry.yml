name: Publish to the official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'npcworkspace-cmyk/npc-todo-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify public bundle
        run: |
          set -euo pipefail
          version="$(jq -r '.version' server.json)"
          package_url="$(jq -r '.packages[0].identifier' server.json)"
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/npc-todo-mcp.mcpb"
          test "$package_url" = "$expected_url"
          digest="$(jq -r '.packages[0].fileSha256' server.json)"
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/npc-todo-mcp.mcpb" "$package_url"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/npc-todo-mcp.mcpb" | sha256sum --check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish server metadata
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
